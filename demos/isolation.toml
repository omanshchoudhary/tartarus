rootfs = "rootfs/alpine"
command = ["/bin/sh", "-c", "echo '--- os'; head -1 /etc/os-release; echo '--- root'; ls /; echo '--- processes'; ps; echo '--- identity'; id; echo '--- hostname'; hostname"]
hostname = "tartarus"

[limits]
memory = "64M"
cpus = 0.5
pids = 32

[seccomp]
blocked = ["mount", "reboot", "unshare"]
